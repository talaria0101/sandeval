name: sandeval

# The vectors probe a live sandbox, so CI runs the parts that do not need one:
# the syntax of the shell tools, the harness self-tests, the vector catalogue
# and a smoke run against throwaway directories. A real run is
# `bin/sandeval auto --replica` inside a disposable replica.

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: shell syntax
        run: |
          bash -n sweep/landlock-surface-sweep.sh
          bash -n tests/run-tests.sh
          bash -n host-verify/verify.sh
          bash -n run-all.sh
      - name: harness self-tests
        run: python3 tests/test_harness.py
      - name: vector catalogue
        run: python3 bin/sandeval list
      - name: smoke run against temp dirs
        run: |
          python3 bin/sandeval run --replica --vector V15,V17 \
            --in "$RUNNER_TEMP" --out "$RUNNER_TEMP" \
            --json "$RUNNER_TEMP/report.json" --report "$RUNNER_TEMP/report.md"
